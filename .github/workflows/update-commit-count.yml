name: Update personal commit count

on:
  workflow_dispatch:

  schedule:
    # Exécution quotidienne à 08:00 UTC
    - cron: "0 8 * * *"

permissions:
  contents: write

concurrency:
  group: update-personal-commit-count
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-commit-count:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}

      - name: Synchronize profile repository
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git fetch origin "$DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"
          git reset --hard "origin/$DEFAULT_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required configuration
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          TARGET_USERNAME: ${{ vars.COMMIT_USERNAME }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Le secret GH_STATS_TOKEN est manquant."
            exit 1
          fi

          if [ -z "${TARGET_USERNAME:-}" ]; then
            echo "::error::La variable COMMIT_USERNAME est manquante."
            exit 1
          fi

      - name: Retrieve accessible repositories
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          set -euo pipefail

          WORK_DIR="$RUNNER_TEMP/commit-count"

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR/repos"

          gh api \
            --paginate \
            "/user/repos?per_page=100&affiliation=owner,collaborator,organization_member" \
            --jq '.[].full_name' \
            | sort -u \
            > "$WORK_DIR/repositories.txt"

          REPOSITORY_COUNT="$(
            wc -l < "$WORK_DIR/repositories.txt" | tr -d ' '
          )"

          echo "$REPOSITORY_COUNT dépôts accessibles trouvés."

          echo "WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"

      - name: Clone repositories and retrieve commits
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          set -euo pipefail

          ALL_COMMITS_FILE="$WORK_DIR/all-commits.txt"

          touch "$ALL_COMMITS_FILE"

          while IFS= read -r repository; do
            if [ -z "$repository" ]; then
              continue
            fi

            echo "--------------------------------------------------"
            echo "Analyse de $repository"

            safe_name="$(
              printf '%s' "$repository" | tr '/:' '__'
            )"

            repository_path="$WORK_DIR/repos/$safe_name.git"

            if gh repo clone "$repository" "$repository_path" -- \
              --mirror \
              --filter=blob:none \
              --quiet
            then
              git \
                --git-dir="$repository_path" \
                log \
                --all \
                --format='%H%x09%ae' \
                >> "$ALL_COMMITS_FILE"

              rm -rf "$repository_path"
            else
              echo "::warning::Impossible de cloner $repository"
            fi
          done < "$WORK_DIR/repositories.txt"

      - name: Count personal commits
        env:
          TARGET_USERNAME: ${{ vars.COMMIT_USERNAME }}
          COMMIT_EMAILS: ${{ secrets.COMMIT_EMAILS }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          work_dir = Path(os.environ["WORK_DIR"])
          commits_file = work_dir / "all-commits.txt"

          username = (
              os.environ.get("TARGET_USERNAME", "")
              .strip()
              .lower()
          )

          raw_emails = os.environ.get("COMMIT_EMAILS", "")

          normalized_emails = raw_emails.replace(";", ",")
          normalized_emails = normalized_emails.replace("\n", ",")
          normalized_emails = normalized_emails.replace(" ", ",")

          configured_emails = set()

          for email in normalized_emails.split(","):
              normalized_email = email.strip().lower()

              if normalized_email:
                  configured_emails.add(normalized_email)

          standard_noreply_email = (
              f"{username}@users.noreply.github.com"
          )

          matching_commits = set()

          if commits_file.exists():
              lines = commits_file.read_text(
                  encoding="utf-8",
                  errors="replace",
              ).splitlines()
          else:
              lines = []

          for line in lines:
              parts = line.split("\t", 1)

              if len(parts) != 2:
                  continue

              commit_sha = parts[0].strip()
              author_email = parts[1].strip().lower()

              if not commit_sha or not author_email:
                  continue

              is_configured_email = (
                  author_email in configured_emails
              )

              is_standard_noreply = (
                  author_email == standard_noreply_email
              )

              is_numbered_noreply = (
                  author_email.endswith(
                      f"+{standard_noreply_email}"
                  )
              )

              if (
                  is_configured_email
                  or is_standard_noreply
                  or is_numbered_noreply
              ):
                  matching_commits.add(commit_sha)

          total_commits = len(matching_commits)

          github_env = Path(os.environ["GITHUB_ENV"])

          with github_env.open(
              "a",
              encoding="utf-8",
          ) as env_file:
              env_file.write(
                  f"TOTAL_COMMITS={total_commits}\n"
              )

          print(
              f"Username analysé : {username}"
          )

          print(
              "Adresses supplémentaires configurées : "
              f"{len(configured_emails)}"
          )

          print(
              f"Commits personnels uniques : {total_commits}"
          )
          PY

      - name: Update README badge
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          total = os.environ.get("TOTAL_COMMITS", "0")

          readme_path = Path("README.md")

          if not readme_path.exists():
              raise SystemExit(
                  "Le fichier README.md est introuvable."
              )

          content = readme_path.read_text(
              encoding="utf-8"
          )

          start_marker = "<!-- COMMIT-COUNT:START -->"
          end_marker = "<!-- COMMIT-COUNT:END -->"

          if start_marker not in content:
              raise SystemExit(
                  "Le marqueur COMMIT-COUNT:START "
                  "est introuvable dans README.md."
              )

          if end_marker not in content:
              raise SystemExit(
                  "Le marqueur COMMIT-COUNT:END "
                  "est introuvable dans README.md."
              )

          start_index = content.index(start_marker)

          end_index = (
              content.index(
                  end_marker,
                  start_index,
              )
              + len(end_marker)
          )

          badge = (
              f"{start_marker}\n"
              f"![Commits]"
              f"(https://img.shields.io/badge/"
              f"Commits-{total}-F4A7B9"
              f"?style=for-the-badge"
              f"&logo=github"
              f"&logoColor=white"
              f"&cacheSeconds=3600)\n"
              f"{end_marker}"
          )

          updated_content = (
              content[:start_index]
              + badge
              + content[end_index:]
          )

          readme_path.write_text(
              updated_content,
              encoding="utf-8",
          )

          print(
              f"README mis à jour avec {total} commits."
          )
          PY

      - name: Commit README update
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi

          git commit \
            -m "chore: update personal commit count"

          git push \
            origin \
            "HEAD:$DEFAULT_BRANCH"
